<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Portfólio técnico em movimento</title><desc id="desc">Cartões de projeto e sinais de segurança animados.</desc>
  <style>@keyframes lift{0%,100%{opacity:.35;transform:translateY(8px)}50%{opacity:1;transform:translateY(-8px)}}@keyframes ping{0%,100%{opacity:.25;transform:scale(.86)}50%{opacity:.95;transform:scale(1.12)}}.card{animation:lift 3.2s ease-in-out infinite}.ping{transform-origin:1050px 352px;animation:ping 2.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.card,.ping{animation:none}}</style>
  <image href="portfolio-hero.png" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>
  <rect class="card" x="765" y="250" width="120" height="78" rx="12" fill="#7fe9e5" opacity=".38"/><rect class="card" style="animation-delay:.55s" x="910" y="345" width="120" height="78" rx="12" fill="#ffc48b" opacity=".32"/><circle class="ping" cx="1050" cy="352" r="34" fill="none" stroke="#90f3e6" stroke-width="4"/>
</svg>
